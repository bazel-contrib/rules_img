syntax = "proto3";

// Package baselayer describes the tar entries that make up a base image layer.
//
// A base image is assembled from several rules (etc_passwd, trust_store,
// linux_skeleton, ...) that only *describe* content; none of them writes a tar.
// Each rule emits a stream of BaseEntry messages, and the terminal
// base_image_layer rule merges all streams into a single flat layer.
//
// The wire format is a length-delimited stream of BaseEntry messages (varint
// size prefix per message, see google.golang.org/protobuf/encoding/protodelim),
// zstd-compressed as a whole. It is an internal implementation detail of
// rules_img: producer and consumer always ship together, so the format carries
// no version field and may change incompatibly at any time.
package pkg.proto.baselayer;

option go_package = "github.com/bazel-contrib/rules_img/img_tool/pkg/proto/baselayer;baselayer";

// EntryType mirrors the tar type flags that can appear in a layer.
enum EntryType {
  // Unset. Treated as an error by consumers.
  ENTRY_TYPE_UNSPECIFIED = 0;
  // Regular file. Content comes from the `content` oneof.
  ENTRY_TYPE_REGULAR = 1;
  // Directory.
  ENTRY_TYPE_DIRECTORY = 2;
  // Symbolic link; `linkname` holds the target.
  ENTRY_TYPE_SYMLINK = 3;
  // Hard link; `linkname` holds the path of the entry it points at.
  ENTRY_TYPE_HARDLINK = 4;
  // Character device; `devmajor`/`devminor` apply.
  ENTRY_TYPE_CHAR_DEVICE = 5;
  // Block device; `devmajor`/`devminor` apply.
  ENTRY_TYPE_BLOCK_DEVICE = 6;
  // FIFO (named pipe).
  ENTRY_TYPE_FIFO = 7;
}

// BaseEntry describes a single tar entry, covering the full metadata surface of
// archive/tar.Header. Fields left at their zero value mean "unset" and are
// filled in by the consumer's defaults.
message BaseEntry {
  // Path inside the image, without a leading "/" (tar convention). Directory
  // paths are stored without a trailing "/"; the consumer adds it.
  string path = 1;

  // Kind of entry.
  EntryType type = 2;

  // Permission bits plus setuid/setgid/sticky, in the encoding of
  // tar.Header.Mode (not Go's fs.FileMode).
  int64 mode = 3;

  // Numeric owner.
  int64 uid = 4;
  int64 gid = 5;

  // Symbolic owner names, recorded in the tar header when set.
  string uname = 6;
  string gname = 7;

  // Target of a symlink or hardlink. Empty for every other type.
  string linkname = 8;

  // Device numbers, only meaningful for character and block devices.
  int64 devmajor = 9;
  int64 devminor = 10;

  // Timestamps in Unix nanoseconds. 0 means the Unix epoch, which is the
  // reproducible default for generated content.
  int64 mtime_unix_nanos = 11;
  // Access and change times. Only emitted when non-zero (they force PAX
  // records, which most base image content does not need).
  int64 atime_unix_nanos = 12;
  int64 ctime_unix_nanos = 13;

  // Raw PAX records, written verbatim into the tar header.
  map<string, string> pax_records = 14;
  // Extended attributes. Stored as SCHILY.xattr.<name> PAX records.
  map<string, string> xattrs = 15;

  // Content of a regular file. Unset for every other type, and also for a
  // regular file that is intentionally empty.
  oneof content {
    // Path of a real file on the execution machine (a Bazel input), relative to
    // the execroot. The producing rule must keep that file in the `files`
    // depset of BaseImageContentInfo so the consuming action can read it.
    string file_path = 16;
    // Content generated by the producing rule, stored inline. Used for the
    // small text files that make up a base image (/etc/passwd, /etc/hosts, ...).
    bytes inline = 17;
  }

  // Label of the rule that produced this entry, e.g. "//pkg:etc_hosts". Used
  // only to point at both sides of a conflict in error messages.
  string producer = 18;
}
