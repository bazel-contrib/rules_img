[test]
name = hash_cas_digest_default_records_nothing
description = hash records no extra digest unless --cas-digest is given

[testdata]
copy = layer.tar.gz=img_toolchain/hash_tests/test_layer.tar.gz

[command]
subcommand = hash
args = --encoding=layer-metadata --digest-mode=digest --history=default-layer layer.tar.gz metadata.json
expect_exit = 0

[assert]
file_valid_json = metadata.json
file_not_contains = metadata.json, cas_digests
