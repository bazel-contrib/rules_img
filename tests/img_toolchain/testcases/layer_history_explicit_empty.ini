[test]
name = layer_history_explicit_empty
description = layer with an explicit empty --history value records no history entry

[file]
name = hello.txt
Hello World

[command]
subcommand = layer
args = --add /hello.txt=hello.txt --history= --metadata metadata.json layer.tar.gz
expect_exit = 0

[assert]
file_exists = metadata.json
file_valid_json = metadata.json
file_not_contains = metadata.json, "created_by"
file_not_contains = metadata.json, "history missing"
