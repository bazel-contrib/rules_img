[test]
name = cpio_layer_ignores_tar_options
description = Options that only apply to tar layers are accepted and ignored for cpio layers

[file]
name = cpio_ignore/hello.txt
Hello World

[command]
subcommand = layer
args = --layer-format cpio --estargz --zstd-chunked --ztoc cpio_ignore.ztoc --create-parent-directories --layer-tree-artifact-handling deduplicate_symlink --add /a/b/hello.txt=cpio_ignore/hello.txt layer.cpio
expect_exit = 0

[assert]
file_exists = layer.cpio
file_valid_cpio = layer.cpio
file_contains = layer.cpio, "Hello World"
file_not_exists = cpio_ignore.ztoc
file_sha256 = layer.cpio, "388f00c221e2d64244afafbc0f0d0b2a15db8c426d463cd4737b9c6c14d02c7a"
