[test]
name = fat32_layer_rejects_symlink
description = FAT32 cannot store symbolic links, so a layer with one fails

[file]
name = fat32_symlink/hello.txt
Hello World

[command]
subcommand = layer
args = --format fat32 --add /hello.txt=fat32_symlink/hello.txt --symlink /link=hello.txt layer.fat32
expect_exit = 1

[assert]
stderr_contains = "FAT cannot store symbolic links"
