[test]
name = disk_image_dd_range
description = img dd copies a range of the disk image with skip and count, in blocks of bs

# Blocks 1280 and 1281 of 4096 bytes are the first 8192 bytes of the ext4 partition,
# which starts at 5 MiB.

[testdata]
copy = disk_fixture.xstream=img_toolchain/disk_image/disk.xstream
copy = disk_fixture_cas/sha256/0410d1bc735edb9a89b3f5ab752bc89309f4a67da70e77b2ce19855aa4032bdd=img_toolchain/disk_image/root.ext4

[command]
subcommand = dd
args = if=disk_fixture.xstream of=disk_range.bin cas-dir=disk_fixture_cas bs=4096 skip=1280 count=2 status=none
expect_exit = 0

[assert]
file_size_gt = disk_range.bin, 8191
file_size_lt = disk_range.bin, 8193
file_sha256 = disk_range.bin, "69f46d885e817e93359a7e9777ff4f0e8184f8fc90a611eb17e39429becaa35f"
