[test]
name = disk_image_mbr_partition_limit
description = An MBR partition table has room for four partitions

[command]
subcommand = disk-image
args = --partition-table mbr --output disk_five.img --partition a --partition-size 1MiB --partition b --partition-size 1MiB --partition c --partition-size 1MiB --partition d --partition-size 1MiB --partition e --partition-size 1MiB
expect_exit = 1

[assert]
stderr_contains = "do not fit in a mbr partition table"
