[test]
name = disk_image_extent_stream
description = An extent stream of a disk image references the ext4 image as a whole, and describes the partition table as data and the free space as holes

# The extent stream is the fixture of disk_image_extent_stream_reconstruct. After a
# deliberate change of the format, regenerate it by copying disk_extent.xstream to
# testdata/img_toolchain/disk_image/disk.xstream.

[testdata]
copy = disk_extent_root.ext4=img_toolchain/disk_image/root.ext4

[command]
subcommand = disk-image
args = --extent-stream --output disk_extent.xstream --output-cas-dir disk_extent_cas --extent-inline-threshold 1 --partition boot --partition-type esp --partition-size 4MiB --partition root --partition-type root-x86-64 --partition-image disk_extent_root.ext4 --partition-size 3MiB
expect_exit = 0

[assert]
file_exists = disk_extent.xstream
file_contains = disk_extent.xstream, "CASEXT"
# the image is in the output CAS directory, under its digest
file_exists = disk_extent_cas/sha256/0410d1bc735edb9a89b3f5ab752bc89309f4a67da70e77b2ce19855aa4032bdd
file_size_lt = disk_extent.xstream, 1000
file_sha256 = disk_extent.xstream, "bcf000dea0cf18f897947bfb7b2ad44dc696db85c71e84c7c10584be2c996fa5"
