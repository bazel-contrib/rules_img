[test]
name = disk_image_dd
description = img dd writes the disk image that an extent stream describes to a file, and skips the holes

# The fixture is the one of disk_image_extent_stream_reconstruct: an 8 MiB disk with one
# ext4 partition, which is a CAS entry. Almost all of the disk is holes, which
# are seeked over when the output file is created.

[testdata]
copy = disk_fixture.xstream=img_toolchain/disk_image/disk.xstream
copy = disk_fixture_cas/sha256/0410d1bc735edb9a89b3f5ab752bc89309f4a67da70e77b2ce19855aa4032bdd=img_toolchain/disk_image/root.ext4

[command]
subcommand = dd
args = if=disk_fixture.xstream of=disk_written.img cas-dir=disk_fixture_cas bs=64K
expect_exit = 0

[assert]
file_valid_gpt = disk_written.img
file_sha256 = disk_written.img, "2668d2cc7a636856089ba5894aa6f7f7ec88e99a51911a296cc6a084065317d7"
stderr_contains = "8405504 bytes"
stderr_contains = "skipped"
