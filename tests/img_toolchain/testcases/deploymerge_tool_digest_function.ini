[test]
name = deploymerge_tool_digest_function
description = deploy-merge records the remote cache digest function resolved by Bazel in the merged manifest

[file]
name = input.json
{"operations":[{"command":"push","registry":"registry.example.com","repository":"team/app","tags":["latest"]}],"settings":{"push_strategy":"lazy","load_strategy":"lazy"}}

[command]
subcommand = deploy-merge
args = --push-strategy lazy --load-strategy lazy --tool-digest-function blake3 input.json output.json
expect_exit = 0

[assert]
file_valid_json = output.json
file_contains = output.json, "digest_function":"blake3"
