[test]
name = iso9660_layer_rationalized_rock_ridge
description = Rationalized Rock Ridge normalizes the owner and the mode the way mkisofs -rational-rock does

[file]
name = iso9660_rr_rational/data.txt
Hello World

[command]
subcommand = layer
args = --layer-format iso9660 --iso9660-rock-ridge rationalized --default-metadata {"uid":1000,"gid":2000,"mode":"0640"} --add /data.txt=iso9660_rr_rational/data.txt layer.iso
expect_exit = 0

[assert]
file_valid_iso9660 = layer.iso
file_contains = layer.iso, "IEEE_P1282"
file_sha256 = layer.iso, "90e063e3278f20fa816ba86d70e8ecbc9f200efb261ab4176931c47d18091e1f"
