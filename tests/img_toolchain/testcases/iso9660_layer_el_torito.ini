[test]
name = iso9660_layer_el_torito
description = El Torito boot entries make the image bootable from BIOS and from UEFI

[file]
name = iso9660_boot/isolinux.bin
BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB

[file]
name = iso9660_boot/efiboot.img
EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE

[command]
subcommand = layer
args = --layer-format iso9660 --iso9660-joliet --add /isolinux/isolinux.bin=iso9660_boot/isolinux.bin --add /EFI/BOOT/efiboot.img=iso9660_boot/efiboot.img --iso9660-boot {"image":"/isolinux/isolinux.bin","platform":"bios","load_size":4,"boot_info_table":true} --iso9660-boot {"image":"/EFI/BOOT/efiboot.img","platform":"uefi","id":"EFI"} layer.iso
expect_exit = 0

[assert]
file_valid_iso9660 = layer.iso
file_contains = layer.iso, "EL TORITO SPECIFICATION"
file_sha256 = layer.iso, "27d68ebdf20f9faf992a011c828652df1a65e23288c192ed93f724de2f6611cd"
