[test]
name = ext4_layer_compact_stream_only
description = An ext4 layer can be written as a compact stream alone, without the image

# The inputs are those of ext4_layer_compact_stream, so the compact stream has to be the same.

[testdata]
copy = ext4_cso_blob=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[file]
name = ext4_cso/small.txt
small file, stays inline

[command]
subcommand = layer
args = --layer-format ext4 --add /blob=ext4_cso_blob --add /small.txt=ext4_cso/small.txt --compact-stream ext4_cso_written.cstream --compact-stream-only --compact-stream-inline-threshold 4096 --metadata ext4_cso_metadata.json
expect_exit = 0

[assert]
file_exists = ext4_cso_written.cstream
file_size_lt = ext4_cso_written.cstream, 2000
file_contains = ext4_cso_written.cstream, "CASSTR"
json_field_equals = ext4_cso_metadata.json, mediaType, application/x-ext4
file_sha256 = ext4_cso_written.cstream, "2f7d1ed5fa68139b4f3f519828f9b3040c05e55e6a252e67b48458bb7a9a134a"
