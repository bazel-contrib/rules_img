[test]
name = manifest_artifact_descriptor_has_platform_by_default
description = Test that a manifest with a non-image config still carries its platform unless --omit-platform is passed

[file]
name = helm_config.json
{"name":"test-chart","version":"1.0.0"}

[command]
subcommand = manifest
args = --config-media-type=application/vnd.cncf.helm.config.v1+json --config-fragment=helm_config.json --os=darwin --architecture=arm64 --manifest=manifest.json --descriptor=descriptor.json
expect_exit = 0

[assert]
file_exists = descriptor.json
file_valid_json = descriptor.json
# Whether a manifest has a platform is the caller's decision (the image_manifest
# rule's omit_platform attribute), not something inferred from the config media
# type: an artifact may well be built for a single platform.
json_field_exists = descriptor.json, platform
file_contains = descriptor.json, "darwin"
file_contains = descriptor.json, "arm64"
