[test]
name = disk_image_partition_from_compact_stream
description = A partition can be the compact stream of a file system image: the disk image is written with the blobs the stream references

# The partition is the stream of ext4_layer_compact_stream: an ext4 image with
# one file that is a reference to the Ubuntu blob below.

[testdata]
copy = disk_partition_stream.cstream=img_toolchain/ext4_compact_stream/layer.cstream
copy = disk_partition_cas/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[command]
subcommand = disk-image
args = --output disk_from_stream.img --partition root --partition-type root-x86-64 --partition-cstream disk_partition_stream.cstream --cas-dir disk_partition_cas
expect_exit = 0

[assert]
file_valid_gpt = disk_from_stream.img
file_sha256 = disk_from_stream.img, "0e1c84ff2a265ef49f9a53ebff8da8df2422ea67552c961b2f9b52cdf9580e05"
