[test]
name = layer_empty_dir_trailing_slash_metadata
description = File metadata keyed with a trailing slash applies to the matching empty directory

[command]
subcommand = layer
args = --empty-dir /var/lib/app/ --file-metadata var/lib/app/={"mode":"0750","uid":4242,"gid":4243} layer.tar.gz
expect_exit = 0

[assert]
tar_entry_type = layer.tar.gz, var/lib/app/, dir
tar_entry_owner = layer.tar.gz, var/lib/app/, 4242:4243
tar_entry_mode = layer.tar.gz, var/lib/app/, 0750
layer_invariants_intact = layer.tar.gz
