[test]
name = disk_image_dd_missing_blob
description = img dd needs the blobs an extent stream references, from a CAS directory or a cache, and says so

[testdata]
copy = disk_fixture.xstream=img_toolchain/disk_image/disk.xstream

[command]
subcommand = dd
args = if=disk_fixture.xstream of=disk_missing.img status=none
expect_exit = 1

[assert]
stderr_contains = "not found"
stderr_contains = "IMG_REAPI_ENDPOINT"
