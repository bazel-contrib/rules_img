[test]
name = iso9660_layer_min_size
description = --iso9660-min-size leaves free space in the image

[file]
name = iso9660_minsize/hello.txt
Hello World

[command]
subcommand = layer
args = --layer-format iso9660 --iso9660-min-size 4MiB --add /hello.txt=iso9660_minsize/hello.txt layer.iso
expect_exit = 0

[assert]
file_valid_iso9660 = layer.iso
file_size_gt = layer.iso, 4194303
