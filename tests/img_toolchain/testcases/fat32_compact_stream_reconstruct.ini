[test]
name = fat32_compact_stream_reconstruct
description = The compact stream of a FAT32 layer is reconstructed to the identical image from the referenced blob

# Fixture: the stream written by fat32_layer_compact_stream. Its only
# reference is the 6688 byte Ubuntu blob, which is its own CAS entry.

[testdata]
copy = fat32_cs_fixture.cstream=img_toolchain/fat32_compact_stream/layer.cstream
copy = cas/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[command]
subcommand = compact-stream
args = reconstruct --compact-stream fat32_cs_fixture.cstream --cas-dir cas --output fat32_reconstructed.fat32
expect_exit = 0

[assert]
file_valid_fat32 = fat32_reconstructed.fat32
file_sha256 = fat32_cs_fixture.cstream, "4e8d613d6cf1241edcc96726df3875a360c611e038224f40b61bbd1e18d51d54"
file_sha256 = fat32_reconstructed.fat32, "e7adf70878b58e95d53d37614d4b9c41fafa8b03b4c951bc1888259d4770dbe5"
