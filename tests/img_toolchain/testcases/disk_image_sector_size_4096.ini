[test]
name = disk_image_sector_size_4096
description = A GPT disk image with 4096 byte sectors has a shorter entry array and the same alignment

[command]
subcommand = disk-image
args = --sector-size 4096 --output disk_4k.img --layout-json disk_4k.json --partition a --partition-size 2MiB --partition b --partition-size 1MiB
expect_exit = 0

[assert]
file_valid_gpt = disk_4k.img
json_field_equals = disk_4k.json, sector_size, 4096
json_field_equals = disk_4k.json, first_usable_lba, 6
file_sha256 = disk_4k.img, "93846b8d16c174a2611d37707b36886c2f30a473ac5039db8e29cafd7689b42e"
