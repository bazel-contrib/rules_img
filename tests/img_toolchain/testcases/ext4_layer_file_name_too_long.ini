[test]
name = ext4_layer_file_name_too_long
description = Names that ext4 cannot store are rejected

[file]
name = ext4_long/hello.txt
Hello World

[command]
subcommand = layer
args = --format ext4 --add /xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx=ext4_long/hello.txt layer.ext4
expect_exit = 1

[assert]
stderr_contains = "longer than 255 bytes"
