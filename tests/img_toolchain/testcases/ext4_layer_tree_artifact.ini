[test]
name = ext4_layer_tree_artifact
description = Tree artifacts (directories) are stored in ext4 layers

[file]
name = ext4_tree/file1.txt
content for file 1

[file]
name = ext4_tree/subdir/file2.txt
content for file 2

[command]
subcommand = layer
args = --layer-format ext4 --add /data=ext4_tree layer.ext4
expect_exit = 0

[assert]
file_valid_ext4 = layer.ext4
file_contains = layer.ext4, "content for file 1"
file_contains = layer.ext4, "content for file 2"
file_sha256 = layer.ext4, "c3f705bb37468b4f920457cd309704598c4ff32db206ac4f3d2f297f54e754be"
