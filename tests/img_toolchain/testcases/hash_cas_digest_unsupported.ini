[test]
name = hash_cas_digest_unsupported
description = hash rejects a digest function it cannot compute

[testdata]
copy = layer.tar.gz=img_toolchain/hash_tests/test_layer.tar.gz

[command]
subcommand = hash
args = --encoding=layer-metadata --digest-mode=digest --cas-digest=md5 layer.tar.gz metadata.json
expect_exit = 1
