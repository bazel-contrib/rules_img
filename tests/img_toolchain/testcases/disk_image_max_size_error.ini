[test]
name = disk_image_max_size_error
description = A disk that needs more than the maximum size is an error

[command]
subcommand = disk-image
args = --output disk_max.img --max-size 2MiB --partition a --partition-size 4MiB
expect_exit = 1

[assert]
stderr_contains = "maximum disk size"
file_not_exists = disk_max.img
