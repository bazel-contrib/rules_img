[test]
name = fat32_layer_simple
description = Test FAT32 layer creation with files in nested directories and metadata output

[file]
name = fat32_simple/hello.txt
Hello World

[command]
subcommand = layer
args = --layer-format fat32 --add /etc/hello.txt=fat32_simple/hello.txt --metadata layer_meta.json layer.fat32
expect_exit = 0

[assert]
file_exists = layer.fat32
file_valid_fat32 = layer.fat32
file_contains = layer.fat32, "Hello World"
file_contains = layer.fat32, "FAT32   "
file_valid_json = layer_meta.json
json_field_equals = layer_meta.json, mediaType, application/x-fat32
file_contains = layer_meta.json, "sha256:"
file_not_contains = layer_meta.json, "tar"
file_sha256 = layer.fat32, "9ed518619b682bce9e9a0745865eea12eead574074c04c404108787bcee2e5d1"
file_sha256 = layer_meta.json, "c02e24496c47ae1e5944e85872b94fbae92f8844af7107579303f0e1be39d2d4"
