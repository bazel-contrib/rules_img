[test]
name = ext4_layer_dedup
description = Identical files are stored once in an ext4 layer, like hard links in a tar layer

[testdata]
copy = blob=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[command]
subcommand = layer
args = --layer-format ext4 --add /one=blob --add /two=blob --add /dir/three=blob layer.ext4
expect_exit = 0

[assert]
file_valid_ext4 = layer.ext4
# 6688 bytes of content take 2 blocks. Three copies would need 6 blocks of
# data, and the whole image would be larger than 49152 bytes.
file_size_gt = layer.ext4, 40000
file_size_lt = layer.ext4, 50000
file_sha256 = layer.ext4, "a1a56e97c7d3593db0d7c2e90ae4a7965f8c57ebc83ee3668733add2a5527167"
