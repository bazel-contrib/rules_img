[test]
name = disk_image_esp_must_be_fat32
description = An EFI system partition has to hold a FAT32 file system

[testdata]
copy = disk_esp_root.ext4=img_toolchain/disk_image/root.ext4

[command]
subcommand = disk-image
args = --output disk_esp_error.img --partition boot --partition-type esp --partition-image disk_esp_root.ext4
expect_exit = 1

[assert]
stderr_contains = "has to be FAT32"
