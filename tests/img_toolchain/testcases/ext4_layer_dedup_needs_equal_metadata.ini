[test]
name = ext4_layer_dedup_needs_equal_metadata
description = Files with the same content but different metadata are not merged in an ext4 layer

[testdata]
copy = blob=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[command]
subcommand = layer
args = --format ext4 --file-metadata one={"mode":"0600"} --file-metadata two={"mode":"0644"} --add one=blob --add two=blob layer.ext4
expect_exit = 0

[assert]
file_valid_ext4 = layer.ext4
# Both copies take 2 blocks of data each: 2 blocks more than with deduplication.
file_size_gt = layer.ext4, 48000
file_sha256 = layer.ext4, "f83046d0ae2fbd4ee2f59d4696f9ab472288507d4820c0b67e87a482ec71cd8a"
