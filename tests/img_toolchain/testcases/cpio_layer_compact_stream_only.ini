[test]
name = cpio_layer_compact_stream_only
description = A cpio layer can be written as a compact stream alone, without the archive

# The inputs are those of cpio_layer_compact_stream, so the compact stream has to be the same.

[testdata]
copy = cpio_cso_blob=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[file]
name = cpio_cso/small.txt
small file, stays inline

[command]
subcommand = layer
args = --layer-format cpio --add /blob=cpio_cso_blob --add /small.txt=cpio_cso/small.txt --compact-stream cpio_cso_written.cstream --compact-stream-only --compact-stream-inline-threshold 4096 --metadata cpio_cso_metadata.json
expect_exit = 0

[assert]
file_exists = cpio_cso_written.cstream
file_size_lt = cpio_cso_written.cstream, 2000
file_contains = cpio_cso_written.cstream, "CASSTR"
json_field_equals = cpio_cso_metadata.json, mediaType, application/x-cpio
file_sha256 = cpio_cso_written.cstream, "bd0de7e8dce6b8c3ab7dc1576a92bc6baa9ce296362cdc4fd3ee46f1f7efc1fa"
