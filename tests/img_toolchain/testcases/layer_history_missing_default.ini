[test]
name = layer_history_missing_default
description = layer with no --history flag falls back to a "history missing" marker

[file]
name = hello.txt
Hello World

[command]
subcommand = layer
args = --add /hello.txt=hello.txt --metadata metadata.json layer.tar.gz
expect_exit = 0

[assert]
file_exists = metadata.json
file_valid_json = metadata.json
json_field_exists = metadata.json, history
file_contains = metadata.json, "history missing"
