[test]
name = ext4_layer_compact_stream
description = An ext4 layer can be written together with a compact stream that references the large files and keeps everything else inline

# The compact stream is the fixture of ext4_compact_stream_reconstruct. After a
# deliberate change of the format, regenerate it by copying ext4_cs_written.cstream to
# testdata/img_toolchain/ext4_compact_stream/layer.cstream.

[testdata]
copy = ext4_cs_blob=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[file]
name = ext4_cs/small.txt
small file, stays inline

[command]
subcommand = layer
args = --layer-format ext4 --add /blob=ext4_cs_blob --add /small.txt=ext4_cs/small.txt --compact-stream ext4_cs_written.cstream --compact-stream-inline-threshold 4096 layer.ext4
expect_exit = 0

[assert]
file_valid_ext4 = layer.ext4
file_exists = ext4_cs_written.cstream
# The stream does not contain the referenced file, and does contain the rest.
file_size_lt = ext4_cs_written.cstream, 2000
file_contains = ext4_cs_written.cstream, "CASSTR"
file_sha256 = layer.ext4, "eae3bfe5c491821415c8a28cd8745494d698d2cdf9064489e63c9ea2ccaed2a0"
file_sha256 = ext4_cs_written.cstream, "29ad39edb9df3a79a0bd45258c45b9fca046397c3d0e62c68cccdc39b85d2cd3"
