[test]
name = cpio_compact_stream_reconstruct
description = The compact stream of a cpio layer is reconstructed to the identical archive from the referenced blob

# Fixture: layer.cstream written by cpio_layer_compact_stream. Its only
# reference is the 6688 byte Ubuntu blob, which is its own CAS entry.

[testdata]
copy = cpio_cs_fixture.cstream=img_toolchain/cpio_compact_stream/layer.cstream
copy = cas/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[command]
subcommand = compact-stream
args = reconstruct --compact-stream cpio_cs_fixture.cstream --cas-dir cas --output reconstructed.cpio
expect_exit = 0

[assert]
file_valid_cpio = reconstructed.cpio
file_sha256 = cpio_cs_fixture.cstream, "bd0de7e8dce6b8c3ab7dc1576a92bc6baa9ce296362cdc4fd3ee46f1f7efc1fa"
file_sha256 = reconstructed.cpio, "a7adc3fb10e8619624da7a3d78a36def6705ef0802e6149a9020acb9520c2827"
