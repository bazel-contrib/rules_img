[test]
name = ext4_compact_stream_reconstruct
description = The compact stream of an ext4 layer is reconstructed to the identical image from the referenced blob

# Fixture: layer.cstream written by ext4_layer_compact_stream. Its only
# reference is the 6688 byte Ubuntu blob, which is its own CAS entry.

[testdata]
copy = ext4_cs_fixture.cstream=img_toolchain/ext4_compact_stream/layer.cstream
copy = cas/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[command]
subcommand = compact-stream
args = reconstruct --compact-stream ext4_cs_fixture.cstream --cas-dir cas --output reconstructed.ext4
expect_exit = 0

[assert]
file_valid_ext4 = reconstructed.ext4
file_sha256 = ext4_cs_fixture.cstream, "2f7d1ed5fa68139b4f3f519828f9b3040c05e55e6a252e67b48458bb7a9a134a"
file_sha256 = reconstructed.ext4, "eae3bfe5c491821415c8a28cd8745494d698d2cdf9064489e63c9ea2ccaed2a0"
