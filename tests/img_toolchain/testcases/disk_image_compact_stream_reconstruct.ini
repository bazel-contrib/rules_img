[test]
name = disk_image_compact_stream_reconstruct
description = The compact stream of a disk image is reconstructed to the identical disk image from the referenced ext4 image

# Fixture: disk.cstream written by disk_image_compact_stream. Its only reference is the
# ext4 image, which is its own CAS entry. The result is the disk image of
# disk_image_ext4_partition.

[testdata]
copy = disk_fixture.cstream=img_toolchain/disk_image/disk.cstream
copy = disk_fixture_cas/sha256/0410d1bc735edb9a89b3f5ab752bc89309f4a67da70e77b2ce19855aa4032bdd=img_toolchain/disk_image/root.ext4

[command]
subcommand = compact-stream
args = reconstruct --compact-stream disk_fixture.cstream --cas-dir disk_fixture_cas --output disk_reconstructed.img
expect_exit = 0

[assert]
file_valid_gpt = disk_reconstructed.img
file_sha256 = disk_fixture.cstream, "dac27e630ef86e957fec2ed7d214634422ddd50d94ff6a26641722559fe86b8c"
file_sha256 = disk_reconstructed.img, "2668d2cc7a636856089ba5894aa6f7f7ec88e99a51911a296cc6a084065317d7"
