[test]
name = disk_image_extent_stream_reconstruct
description = The extent stream of a disk image is reconstructed to the identical disk image from the referenced ext4 image

# Fixture: disk.xstream written by disk_image_extent_stream. Its only reference is the
# ext4 image, which is its own CAS entry. The result is the disk image of
# disk_image_ext4_partition.

[testdata]
copy = disk_fixture.xstream=img_toolchain/disk_image/disk.xstream
copy = disk_fixture_cas/sha256/0410d1bc735edb9a89b3f5ab752bc89309f4a67da70e77b2ce19855aa4032bdd=img_toolchain/disk_image/root.ext4

[command]
subcommand = extent-stream
args = reconstruct --extent-stream disk_fixture.xstream --cas-dir disk_fixture_cas --output disk_reconstructed.img
expect_exit = 0

[assert]
file_valid_gpt = disk_reconstructed.img
file_sha256 = disk_fixture.xstream, "83ab3f2196d2a371b6711aac7de169e73614ab76418720e43724a106bc31406d"
file_sha256 = disk_reconstructed.img, "2668d2cc7a636856089ba5894aa6f7f7ec88e99a51911a296cc6a084065317d7"
