[test]
name = disk_image_min_size
description = A minimum size makes the disk larger, with the backup partition table at its end

[command]
subcommand = disk-image
args = --output disk_min.img --min-size 64MiB --partition a --partition-size 1MiB
expect_exit = 0

[assert]
file_valid_gpt = disk_min.img
file_size_gt = disk_min.img, 67108863
file_size_lt = disk_min.img, 67108865
file_sha256 = disk_min.img, "67a30fcaf62884061213a5674e512922ffb1e5a8b554dbba855047309cfb2cef"
