[test]
name = disk_image_dd_blob_descriptor
description = img dd writes an image that is only known by its digest and size (a descriptor), which is fetched from the CAS directory

# This is how a raw disk image, or a layer that is a file, is written lazily: the
# descriptor is all that is shipped, the bytes come from a cache by digest.

[testdata]
copy = root.blob.json=img_toolchain/disk_image/root.blob.json
copy = fixture_cas/sha256/0410d1bc735edb9a89b3f5ab752bc89309f4a67da70e77b2ce19855aa4032bdd=img_toolchain/disk_image/root.ext4

[command]
subcommand = dd
args = blob-descriptor=root.blob.json of=root_written.ext4 cas-dir=fixture_cas status=none
expect_exit = 0

[assert]
file_sha256 = root_written.ext4, "0410d1bc735edb9a89b3f5ab752bc89309f4a67da70e77b2ce19855aa4032bdd"
