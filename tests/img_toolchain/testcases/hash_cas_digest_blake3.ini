[test]
name = hash_cas_digest_blake3
description = hash records the BLAKE3 digest of a layer next to its SHA256 when asked to, for remote caches started with --digest_function=blake3

[testdata]
copy = layer.tar.gz=img_toolchain/hash_tests/test_layer.tar.gz

[command]
subcommand = hash
args = --encoding=layer-metadata --digest-mode=digest --digest-mode=diff_id --history=default-layer --cas-digest=blake3 layer.tar.gz metadata.json
expect_exit = 0

[assert]
file_exists = metadata.json
file_valid_json = metadata.json
json_field_exists = metadata.json, digest
json_field_exists = metadata.json, size
file_contains = metadata.json, "cas_digests"
file_contains = metadata.json, "blake3": "5d45f6900a57f5a74f414eb2f13003707fee6d0645dbd2e6b1496f291a27ee7d"
