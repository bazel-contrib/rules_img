[test]
name = iso9660_layer_udf
description = The UDF extension adds ECMA-167 structures describing the same file data

[file]
name = iso9660_udf/payload.txt
UDF describes the same bytes

[command]
subcommand = layer
args = --layer-format iso9660 --iso9660-udf --add /payload.txt=iso9660_udf/payload.txt layer.iso
expect_exit = 0

[assert]
file_valid_iso9660 = layer.iso
# The UDF volume recognition sequence continues the ISO 9660 one.
file_contains = layer.iso, "BEA01"
file_contains = layer.iso, "NSR02"
file_contains = layer.iso, "TEA01"
file_contains = layer.iso, "*OSTA UDF Compliant"
file_sha256 = layer.iso, "40f6a19388a9fc8e0f09b562bd4bd839f81132be94acb6bb46f6bbb60dab48f0"
