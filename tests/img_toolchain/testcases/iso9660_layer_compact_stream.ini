[test]
name = iso9660_layer_compact_stream
description = An ISO 9660 layer can be written together with a compact stream that references the large files and keeps everything else inline

# The compact stream is the fixture of iso9660_compact_stream_reconstruct. After
# a deliberate change of the format, regenerate it by copying
# iso9660_cs_written.cstream to testdata/img_toolchain/iso9660_compact_stream/layer.cstream.

[testdata]
copy = iso9660_cs_blob=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[file]
name = iso9660_cs/small.txt
small file, stays inline

[command]
subcommand = layer
args = --layer-format iso9660 --iso9660-joliet --iso9660-udf --add /blob=iso9660_cs_blob --add /small.txt=iso9660_cs/small.txt --compact-stream iso9660_cs_written.cstream --compact-stream-inline-threshold 4096 layer.iso
expect_exit = 0

[assert]
file_valid_iso9660 = layer.iso
file_exists = iso9660_cs_written.cstream
# The stream does not contain the referenced file, and does contain the rest.
file_size_lt = iso9660_cs_written.cstream, 20000
file_contains = iso9660_cs_written.cstream, "CASSTR"
file_sha256 = layer.iso, "8dcf532716c03bdd8fbb188e361377b56f81ea4e6f8193406247757c95b3d1d2"
file_sha256 = iso9660_cs_written.cstream, "e7a6f09d306608a90eb8dbafa4128ab57c34eac3457625f5c36f0292f05ef7b3"
