[test]
name = disk_image_compact_stream
description = A compact stream of a disk image references the ext4 image as a whole and keeps the partition table and the free space inline

# The compact stream is the fixture of disk_image_compact_stream_reconstruct. After a
# deliberate change of the format, regenerate it by copying disk_compact.cstream to
# testdata/img_toolchain/disk_image/disk.cstream.

[testdata]
copy = disk_compact_root.ext4=img_toolchain/disk_image/root.ext4

[command]
subcommand = disk-image
args = --compact --output disk_compact.cstream --output-cas-dir disk_compact_cas --compact-stream-inline-threshold 1 --partition boot --partition-type esp --partition-size 4MiB --partition root --partition-type root-x86-64 --partition-image disk_compact_root.ext4 --partition-size 3MiB
expect_exit = 0

[assert]
file_exists = disk_compact.cstream
file_contains = disk_compact.cstream, "CASSTR"
# the image is in the output CAS directory, under its digest
file_exists = disk_compact_cas/sha256/0410d1bc735edb9a89b3f5ab752bc89309f4a67da70e77b2ce19855aa4032bdd
file_size_lt = disk_compact.cstream, 4000
file_sha256 = disk_compact.cstream, "dac27e630ef86e957fec2ed7d214634422ddd50d94ff6a26641722559fe86b8c"
