[test]
name = ext4_layer_no_dedup
description = With --ext4-deduplicate=false every copy of a file is stored in an ext4 layer

[testdata]
copy = blob=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[command]
subcommand = layer
args = --layer-format ext4 --ext4-deduplicate=false --add /one=blob --add /two=blob --add /dir/three=blob layer.ext4
expect_exit = 0

[assert]
file_valid_ext4 = layer.ext4
# Three copies of 6688 bytes take 6 blocks of data, which the deduplicated image
# of ext4_layer_dedup does not need.
file_size_gt = layer.ext4, 55000
file_sha256 = layer.ext4, "c66dc09bb1d2b7583f2402baffbd115727c97ca2273b6259f9d80f8819a87fb6"
