[test]
name = cpio_layer_name_too_long
description = Names that cpio cannot store are rejected

[file]
name = cpio_long/hello.txt
Hello World

[command]
subcommand = layer
args = --layer-format cpio --add _long/hello.txt layer.cpio
expect_exit = 1

[assert]
stderr_contains = "longer than 4095 bytes"
