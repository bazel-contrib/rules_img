[test]
name = cpio_compact_stream_reconstruct_missing_blob
description = Reconstructing the compact stream of a cpio layer fails if the referenced blob is not available

[testdata]
copy = cpio_cs_fixture.cstream=img_toolchain/cpio_compact_stream/layer.cstream

[command]
subcommand = compact-stream
args = reconstruct --compact-stream cpio_cs_fixture.cstream --cas-dir empty_cas --output reconstructed.cpio
expect_exit = 1

[assert]
stderr_contains = "1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02"
