[test]
name = expandtemplate_expose_kv_invalid_names
description = Test expand-template with --expose-kv ignoring keys which are not valid template variable names

[file]
name = input.json
{
  "templates": {
    "path_value": "{{$PATH}}",
    "memory_lock_value": "{{getkv .base.config.config.env \"bootstrap.memory_lock\"}}"
  }
}

[file]
name = base_config.json
{
  "config": {
    "Env": [
      "PATH=/usr/local/bin:/usr/bin:/bin",
      "bootstrap.memory_lock=true",
      "discovery.type=single-node",
      "my-var=value"
    ]
  }
}

[command]
subcommand = expand-template
args = --json-var base.config=base_config.json --expose-kv base.config.config.env input.json output.json
expect_exit = 0

[assert]
file_exists = output.json
file_valid_json = output.json
json_field_equals = output.json, path_value, /usr/local/bin:/usr/bin:/bin
json_field_equals = output.json, memory_lock_value, true
file_not_contains = output.json, "{{"
