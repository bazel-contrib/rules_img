[test]
name = cpio_layer_no_dedup
description = With --cpio-deduplicate=false every copy of a file is stored in a cpio layer

[testdata]
copy = blob=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[command]
subcommand = layer
args = --layer-format cpio --cpio-deduplicate=false --add /one=blob --add /two=blob --add /dir/three=blob layer.cpio
expect_exit = 0

[assert]
file_valid_cpio = layer.cpio
# Three copies of 6688 bytes, which the deduplicated archive of cpio_layer_dedup
# does not need.
file_size_gt = layer.cpio, 20000
file_sha256 = layer.cpio, "30c497b9844102f08ccf6bb9df907d20d1df21104c1c5b5eed529654e0b282b2"
