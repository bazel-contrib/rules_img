[test]
name = layer_cas_digest_blake3
description = layer records the BLAKE3 digest of the layer blob next to its SHA256 when asked to

[file]
name = small.txt
Small content for the BLAKE3 digest test

[command]
subcommand = layer
args = --add /small.txt=small.txt --format gzip --cas-digest blake3 --metadata layer_meta.json layer.tgz
expect_exit = 0

[assert]
file_exists = layer.tgz
file_valid_json = layer_meta.json
json_field_exists = layer_meta.json, digest
file_contains = layer_meta.json, "tar+gzip"
file_contains = layer_meta.json, "cas_digests"
file_contains = layer_meta.json, "blake3":
layer_invariants_intact = layer.tgz
