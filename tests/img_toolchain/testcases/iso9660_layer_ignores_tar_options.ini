[test]
name = iso9660_layer_ignores_tar_options
description = The options that only apply to tar layers are ignored for ISO 9660 layers

[file]
name = iso9660_ignore/hello.txt
Hello World

[command]
subcommand = layer
args = --layer-format iso9660 --format gzip --estargz --zstd-chunked --ztoc unused.ztoc --compression-level 9 --add /hello.txt=iso9660_ignore/hello.txt --metadata layer_meta.json layer.iso
expect_exit = 0

[assert]
file_valid_iso9660 = layer.iso
file_not_exists = unused.ztoc
json_field_equals = layer_meta.json, mediaType, application/x-iso9660-image
