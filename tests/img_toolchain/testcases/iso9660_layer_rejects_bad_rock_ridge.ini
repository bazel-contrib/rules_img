[test]
name = iso9660_layer_rejects_bad_rock_ridge
description = An unknown --iso9660-rock-ridge value is rejected instead of silently disabling the extension

[file]
name = iso9660_rr_bad/data.txt
Hello World

[command]
subcommand = layer
args = --layer-format iso9660 --iso9660-rock-ridge sometimes --add /data.txt=iso9660_rr_bad/data.txt layer.iso
expect_exit = 1

[assert]
stderr_contains = "Unknown --iso9660-rock-ridge value"
