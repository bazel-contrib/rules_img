[test]
name = ext4_layer_ignores_tar_options
description = Options that only apply to tar layers are accepted and ignored for ext4 layers

[file]
name = ext4_ignore/hello.txt
Hello World

[command]
subcommand = layer
args = --layer-format ext4 --estargz --compressor-jobs 4 --compression-level 9 --compact-stream-only --ztoc ext4_ignore.ztoc --create-parent-directories --layer-tree-artifact-handling deduplicate_symlink --add /a/b/hello.txt=ext4_ignore/hello.txt layer.ext4
expect_exit = 0

[assert]
file_exists = layer.ext4
file_valid_ext4 = layer.ext4
file_contains = layer.ext4, "Hello World"
file_not_exists = ext4_ignore.ztoc
file_sha256 = layer.ext4, "a2dc4bf8d4d1e4686b456bfbe59223ff016a2ade9752951a5e0bdec7e155fb05"
