[test]
name = disk_image_partition_stream_missing_blob
description = A disk image with a partition that is a compact stream needs the blobs the stream references

[testdata]
copy = disk_partition_stream.cstream=img_toolchain/ext4_compact_stream/layer.cstream

[command]
subcommand = disk-image
args = --output disk_missing_blob.img --partition root --partition-cstream disk_partition_stream.cstream --cas-dir disk_no_such_cas
expect_exit = 1

[assert]
stderr_contains = "not found in content-addressed directory"
