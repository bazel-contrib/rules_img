[test]
name = cpio_layer_compact_stream
description = A cpio layer can be written together with a compact stream that references the large files and keeps everything else inline

# The compact stream is the fixture of cpio_compact_stream_reconstruct. After a
# deliberate change of the format, regenerate it by copying cpio_cs_written.cstream to
# testdata/img_toolchain/cpio_compact_stream/layer.cstream.

[testdata]
copy = cpio_cs_blob=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[file]
name = cpio_cs/small.txt
small file, stays inline

[command]
subcommand = layer
args = --layer-format cpio --add /blob=cpio_cs_blob --add /small.txt=cpio_cs/small.txt --compact-stream cpio_cs_written.cstream --compact-stream-inline-threshold 4096 layer.cpio
expect_exit = 0

[assert]
file_valid_cpio = layer.cpio
file_exists = cpio_cs_written.cstream
# The stream does not contain the referenced file, and does contain the rest.
file_size_lt = cpio_cs_written.cstream, 2000
file_contains = cpio_cs_written.cstream, "CASSTR"
file_sha256 = layer.cpio, "a7adc3fb10e8619624da7a3d78a36def6705ef0802e6149a9020acb9520c2827"
file_sha256 = cpio_cs_written.cstream, "bd0de7e8dce6b8c3ab7dc1576a92bc6baa9ce296362cdc4fd3ee46f1f7efc1fa"
