[test]
name = fat32_layer_compact_stream_only
description = A FAT32 layer can be written as a compact stream alone, without the image

# The inputs are those of fat32_layer_compact_stream, so the compact stream has to be the same.

[testdata]
copy = fat32_cso_blob=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[file]
name = fat32_cso/small.txt
small file, stays inline

[command]
subcommand = layer
args = --layer-format fat32 --add /blob=fat32_cso_blob --add /small.txt=fat32_cso/small.txt --compact-stream fat32_cso_written.cstream --compact-stream-only --compact-stream-inline-threshold 4096 --metadata fat32_cso_metadata.json
expect_exit = 0

[assert]
file_exists = fat32_cso_written.cstream
file_size_lt = fat32_cso_written.cstream, 8000
file_contains = fat32_cso_written.cstream, "CASSTR"
json_field_equals = fat32_cso_metadata.json, mediaType, application/x-fat32
file_sha256 = fat32_cso_written.cstream, "8441587f25cf356b446497d7ca383ec1477310684d51c602584c28739ca18341"
