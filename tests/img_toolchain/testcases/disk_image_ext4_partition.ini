[test]
name = disk_image_ext4_partition
description = A disk image with an ext4 image in a partition, followed by free space in the partition

[testdata]
copy = disk_root.ext4=img_toolchain/disk_image/root.ext4

[command]
subcommand = disk-image
args = --output disk_ext4.img --partition boot --partition-type esp --partition-size 4MiB --partition root --partition-type root-x86-64 --partition-image disk_root.ext4 --partition-size 3MiB
expect_exit = 0

[assert]
file_valid_gpt = disk_ext4.img
file_contains = disk_ext4.img, "NAME=fixture"
file_sha256 = disk_ext4.img, "2668d2cc7a636856089ba5894aa6f7f7ec88e99a51911a296cc6a084065317d7"
