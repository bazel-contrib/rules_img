[test]
name = cpio_layer_simple
description = Test cpio layer creation with a file, a symlink and metadata output

[file]
name = cpio_simple/hello.txt
Hello World

[symlinks]
create = cpio_simple_link=cpio_simple/hello.txt

[command]
subcommand = layer
args = --layer-format cpio --add /etc/hello.txt=cpio_simple/hello.txt --add /etc/link=cpio_simple_link --metadata layer_meta.json layer.cpio
expect_exit = 0

[assert]
file_exists = layer.cpio
file_valid_cpio = layer.cpio
file_contains = layer.cpio, "070701"
file_contains = layer.cpio, "Hello World"
file_valid_json = layer_meta.json
json_field_equals = layer_meta.json, mediaType, application/x-cpio
file_contains = layer_meta.json, "sha256:"
file_not_contains = layer_meta.json, "tar"
file_sha256 = layer.cpio, "63e9e24c3677fa078bd32acb68a9c24ad4906a9a704728f5652059fe908e4aa3"
file_sha256 = layer_meta.json, "37cc480090fd5aeea381767d4beaf80c108be2edca443e238565ce3765815a0f"
