[test]
name = iso9660_layer_compact_stream_only
description = An ISO 9660 layer can be written as a compact stream alone, without the image

# The inputs are those of iso9660_layer_compact_stream, so the compact stream has to be the same.

[testdata]
copy = iso9660_cso_blob=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[file]
name = iso9660_cso/small.txt
small file, stays inline

[command]
subcommand = layer
args = --layer-format iso9660 --iso9660-joliet --iso9660-udf --add /blob=iso9660_cso_blob --add /small.txt=iso9660_cso/small.txt --compact-stream iso9660_cso_written.cstream --compact-stream-only --compact-stream-inline-threshold 4096 --metadata iso9660_cso_metadata.json
expect_exit = 0

[assert]
file_exists = iso9660_cso_written.cstream
file_size_lt = iso9660_cso_written.cstream, 20000
file_contains = iso9660_cso_written.cstream, "CASSTR"
json_field_equals = iso9660_cso_metadata.json, mediaType, application/x-iso9660-image
file_sha256 = iso9660_cso_written.cstream, "e7a6f09d306608a90eb8dbafa4128ab57c34eac3457625f5c36f0292f05ef7b3"
