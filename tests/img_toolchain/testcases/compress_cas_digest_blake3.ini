[test]
name = compress_cas_digest_blake3
description = compress records the BLAKE3 digest of the recompressed layer next to its SHA256 when asked to

[testdata]
copy = input_blob=ubuntu/blobs/sha256/74f38fa7c32fd13263ce430206bc5d046dce1543e5263d47919b85a64ccd128b

[command]
subcommand = compress
args = --format=gzip --cas-digest=blake3 --metadata=compress-meta.json input_blob compressed.tar.gz
expect_exit = 0

[assert]
file_exists = compressed.tar.gz
file_valid_json = compress-meta.json
json_field_exists = compress-meta.json, digest
file_contains = compress-meta.json, "cas_digests"
file_contains = compress-meta.json, "blake3":
