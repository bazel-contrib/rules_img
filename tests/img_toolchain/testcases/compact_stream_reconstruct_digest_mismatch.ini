[test]
name = compact_stream_reconstruct_digest_mismatch
description = Direct reconstruction reports the cstream file digest and size when its embedded compressed stream digest is wrong

# Fixture generation (with img on PATH):
# printf 'Hello from a compact stream!\n' > hello.txt
# img layer --add /hello.txt=hello.txt --format gzip --compression-level 6 --compressor-jobs 1 --compact-stream-inline-threshold 4096 --compact-stream layer.cstream layer.tar.gz
# Flip the first byte of CompressedStreamDigest at header offset 72:
# python3 -c 'from pathlib import Path; p = Path("layer.cstream"); b = bytearray(p.read_bytes()); b[72] ^= 0xff; p.write_bytes(b)'
# Copy layer.cstream to testdata/img_toolchain/compact_stream_digest_mismatch.cstream.
# All content is inline, so no CAS blobs are needed. Keep this fixture stable
# to exercise format compatibility as well as the diagnostic.

[testdata]
copy = digest_mismatch.cstream=img_toolchain/compact_stream_digest_mismatch.cstream

[command]
subcommand = compact-stream
args = reconstruct --compact-stream digest_mismatch.cstream --cas-dir . --output reconstructed.tar.gz
expect_exit = 1

[assert]
file_sha256 = digest_mismatch.cstream, "3a037a92ac62ffb16563ef5b160470fc55b6db28e354dbc5452b72511976c1ec"
stderr_contains = "reconstructed compressed stream mismatch: expected a compressed stream with digest 7ce304b92ca084ccb98a3279bd9c0cc3897d0ad4f4fc754aa16efb3c9b76fb67 and size 116, but reconstructed a stream with digest 83e304b92ca084ccb98a3279bd9c0cc3897d0ad4f4fc754aa16efb3c9b76fb67 and size 116"
stderr_contains = "cstream file has SHA-256 digest 3a037a92ac62ffb16563ef5b160470fc55b6db28e354dbc5452b72511976c1ec and size 246"
