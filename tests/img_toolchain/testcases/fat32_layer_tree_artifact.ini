[test]
name = fat32_layer_tree_artifact
description = Tree artifacts (directories) are stored in FAT32 layers

[file]
name = fat32_tree/file1.txt
content for file 1

[file]
name = fat32_tree/subdir/file2.txt
content for file 2

[command]
subcommand = layer
args = --layer-format fat32 --add /data=fat32_tree layer.fat32
expect_exit = 0

[assert]
file_valid_fat32 = layer.fat32
file_contains = layer.fat32, "content for file 1"
file_contains = layer.fat32, "content for file 2"
file_sha256 = layer.fat32, "4cc0862358839c510e0081045bf688f1ce4a6625676083730d143fd919f165db"
