[test]
name = layer_history_explicit_value
description = layer --history records the given created_by string verbatim

[file]
name = hello.txt
Hello World

[command]
subcommand = layer
args = --add /hello.txt=hello.txt --history=custom-created-by-entry --metadata metadata.json layer.tar.gz
expect_exit = 0

[assert]
file_exists = metadata.json
file_valid_json = metadata.json
file_contains = metadata.json, "custom-created-by-entry"
file_not_contains = metadata.json, "history missing"
