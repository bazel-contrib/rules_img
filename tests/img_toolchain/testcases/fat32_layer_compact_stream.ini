[test]
name = fat32_layer_compact_stream
description = A FAT32 layer can be written together with a compact stream that references the large files and keeps everything else inline

# The compact stream is the fixture of fat32_compact_stream_reconstruct. After a
# deliberate change of the format, regenerate it by copying fat32_cs_written.cstream to
# testdata/img_toolchain/fat32_compact_stream/layer.cstream.

[testdata]
copy = fat32_cs_blob=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[file]
name = fat32_cs/small.txt
small file, stays inline

[command]
subcommand = layer
args = --format fat32 --add /blob=fat32_cs_blob --add /small.txt=fat32_cs/small.txt --compact-stream fat32_cs_written.cstream --compact-stream-inline-threshold 4096 layer.fat32
expect_exit = 0

[assert]
file_valid_fat32 = layer.fat32
file_exists = fat32_cs_written.cstream
# The stream does not contain the referenced file, and does contain the rest.
file_size_lt = fat32_cs_written.cstream, 8000
file_contains = fat32_cs_written.cstream, "CASSTR"
file_sha256 = layer.fat32, "e7adf70878b58e95d53d37614d4b9c41fafa8b03b4c951bc1888259d4770dbe5"
file_sha256 = fat32_cs_written.cstream, "4e8d613d6cf1241edcc96726df3875a360c611e038224f40b61bbd1e18d51d54"
