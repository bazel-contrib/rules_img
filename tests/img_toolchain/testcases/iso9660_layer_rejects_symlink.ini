[test]
name = iso9660_layer_rejects_symlink
description = Plain ISO 9660 cannot describe a symbolic link, so a layer with one fails without Rock Ridge

[file]
name = iso9660_nosymlink/hello.txt
Hello World

[command]
subcommand = layer
args = --layer-format iso9660 --iso9660-rock-ridge=disabled --add /hello.txt=iso9660_nosymlink/hello.txt --symlink /link=hello.txt layer.iso
expect_exit = 1

[assert]
stderr_contains = "needs the Rock Ridge extension"
