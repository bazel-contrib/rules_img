[test]
name = iso9660_layer_rejects_missing_boot_image
description = A boot entry whose image is not in the layer fails the build

[file]
name = iso9660_noboot/hello.txt
Hello World

[command]
subcommand = layer
args = --layer-format iso9660 --add /hello.txt=iso9660_noboot/hello.txt --iso9660-boot {"image":"/boot/absent.img"} layer.iso
expect_exit = 1

[assert]
stderr_contains = "is not in the image"
