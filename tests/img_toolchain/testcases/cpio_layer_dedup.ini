[test]
name = cpio_layer_dedup
description = Identical files are stored once in a cpio layer, like hard links in a tar layer

[testdata]
copy = blob=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[command]
subcommand = layer
args = --layer-format cpio --add /one=blob --add /two=blob --add /dir/three=blob layer.cpio
expect_exit = 0

[assert]
file_valid_cpio = layer.cpio
# 6688 bytes of content are stored once. Three copies would make the archive
# larger than 20000 bytes.
file_size_gt = layer.cpio, 6688
file_size_lt = layer.cpio, 8000
file_sha256 = layer.cpio, "c2cb0ff1c9d1b60ad451a014187edf4a5e150158d867f566bac3504e5f0f03d2"
