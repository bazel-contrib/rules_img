[test]
name = layer_empty_dir_in_tree
description = A directory added to one copy of a tree stays in that copy

[file]
name = tree/file
contents

[command]
subcommand = layer
args = --add /first=tree --add /second=tree --add /third=tree --empty-dir /second/cache --create-parent-directories --layer-tree-artifact-handling deduplicate_symlink layer.tar.gz
expect_exit = 0

[assert]
tar_entry_type = layer.tar.gz, first/, dir
tar_entry_type = layer.tar.gz, second/, dir
tar_entry_type = layer.tar.gz, second/cache/, dir
tar_entry_type = layer.tar.gz, third, symlink
tar_entry_not_exists = layer.tar.gz, first/cache/
layer_invariants_intact = layer.tar.gz
