[test]
name = disk_image_gpt_placeholders
description = A GPT disk image with empty placeholder partitions of different sizes and types

[command]
subcommand = disk-image
args = --output disk_gpt_placeholders.img --layout-json disk_gpt_placeholders.json --partition first --partition-size 2MiB --partition second --partition-type swap --partition-size 5MiB --partition third --partition-type home --partition-size 1MiB --partition-attribute no_automount
expect_exit = 0

[assert]
file_valid_gpt = disk_gpt_placeholders.img
file_valid_json = disk_gpt_placeholders.json
json_field_equals = disk_gpt_placeholders.json, partition_table, gpt
json_field_equals = disk_gpt_placeholders.json, sector_size, 512
# 1 MiB in front, 8 MiB of partitions, and the backup table (33 sectors)
file_size_gt = disk_gpt_placeholders.img, 9437183
file_size_lt = disk_gpt_placeholders.img, 9500000
file_sha256 = disk_gpt_placeholders.img, "cca696719339e92ad128cd9c4701e6ac2012e4c3521e85ddd891621243d16663"
file_sha256 = disk_gpt_placeholders.json, "e1aea74a603a8cf2159b8806902da503698758b0429c9e41ff8dee4a26ee7e50"
