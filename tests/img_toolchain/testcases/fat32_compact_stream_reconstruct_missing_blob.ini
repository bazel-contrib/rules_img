[test]
name = fat32_compact_stream_reconstruct_missing_blob
description = Reconstructing the compact stream of a FAT32 layer fails if the referenced blob is not available

[testdata]
copy = fat32_cs_fixture.cstream=img_toolchain/fat32_compact_stream/layer.cstream

[command]
subcommand = compact-stream
args = reconstruct --compact-stream fat32_cs_fixture.cstream --cas-dir fat32_empty_cas --output fat32_reconstructed.fat32
expect_exit = 1

[assert]
stderr_contains = "1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02"
