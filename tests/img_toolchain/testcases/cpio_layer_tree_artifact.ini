[test]
name = cpio_layer_tree_artifact
description = Tree artifacts (directories) are stored in cpio layers

[file]
name = cpio_tree/file1.txt
content for file 1

[file]
name = cpio_tree/subdir/file2.txt
content for file 2

[command]
subcommand = layer
args = --layer-format cpio --add /data=cpio_tree layer.cpio
expect_exit = 0

[assert]
file_valid_cpio = layer.cpio
file_contains = layer.cpio, "content for file 1"
file_contains = layer.cpio, "content for file 2"
file_sha256 = layer.cpio, "5c4a2b06f733fd0cb1d47688adb098b2aa826fb994fb405143e279acf0fbfcca"
