[test]
name = iso9660_layer_simple
description = Test ISO 9660 layer creation with files in nested directories and metadata output

[file]
name = iso9660_simple/hello.txt
Hello World

[command]
subcommand = layer
args = --layer-format iso9660 --iso9660-volume-id TESTVOL --add /etc/hello.txt=iso9660_simple/hello.txt --metadata layer_meta.json layer.iso
expect_exit = 0

[assert]
file_exists = layer.iso
file_valid_iso9660 = layer.iso
file_contains = layer.iso, "Hello World"
file_contains = layer.iso, "CD001"
file_contains = layer.iso, "TESTVOL"
file_valid_json = layer_meta.json
json_field_equals = layer_meta.json, mediaType, application/x-iso9660-image
file_contains = layer_meta.json, "sha256:"
file_not_contains = layer_meta.json, "tar"
file_sha256 = layer.iso, "44b04a2287b9e08fff8775b5914a4242a6dad2e50894942789feb040d1f381a4"
file_sha256 = layer_meta.json, "daf85490911c79714d7334971952392fabf9a93c3aaa5b7aa8ea9671d0d35c18"
