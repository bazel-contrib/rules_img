[test]
name = iso9660_layer_joliet
description = The Joliet extension adds a second hierarchy with UCS-2 names

[file]
name = iso9660_joliet/Readme.md
Joliet keeps the name

[command]
subcommand = layer
args = --layer-format iso9660 --iso9660-joliet --add /Readme.md=iso9660_joliet/Readme.md layer.iso
expect_exit = 0

[assert]
file_valid_iso9660 = layer.iso
# The supplementary volume descriptor carries the escape sequence selecting UCS-2.
file_contains = layer.iso, "%/E"
file_sha256 = layer.iso, "e3c6048abecd7fa857624f6cce4bd3d551e6185c0eab33b5dab5873200697343"
