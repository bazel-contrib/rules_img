[test]
name = iso9660_compact_stream_reconstruct
description = The compact stream of an ISO 9660 layer is reconstructed to the identical image from the referenced blob

# Fixture: the stream written by iso9660_layer_compact_stream. Its only
# reference is the 6688 byte Ubuntu blob, which is its own CAS entry.

[testdata]
copy = iso9660_cs_fixture.cstream=img_toolchain/iso9660_compact_stream/layer.cstream
copy = cas/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[command]
subcommand = compact-stream
args = reconstruct --compact-stream iso9660_cs_fixture.cstream --cas-dir cas --output iso9660_reconstructed.iso
expect_exit = 0

[assert]
file_valid_iso9660 = iso9660_reconstructed.iso
file_sha256 = iso9660_cs_fixture.cstream, "e7a6f09d306608a90eb8dbafa4128ab57c34eac3457625f5c36f0292f05ef7b3"
file_sha256 = iso9660_reconstructed.iso, "8dcf532716c03bdd8fbb188e361377b56f81ea4e6f8193406247757c95b3d1d2"
