[test]
name = fat32_layer_rejects_invalid_name
description = Characters FAT cannot store in names are rejected

[file]
name = fat32_invalid/hello.txt
Hello World

[command]
subcommand = layer
args = --format fat32 --add /a:b.txt=fat32_invalid/hello.txt layer.fat32
expect_exit = 1

[assert]
stderr_contains = "which FAT cannot store"
