[test]
name = iso9660_layer_rock_ridge
description = Rock Ridge is on by default, so the real names and symbolic links survive

[file]
name = iso9660_rr/MixedCase.txt
Hello Rock Ridge

[command]
subcommand = layer
args = --layer-format iso9660 --add /etc/MixedCase.txt=iso9660_rr/MixedCase.txt --symlink /etc/link=MixedCase.txt layer.iso
expect_exit = 0

[assert]
file_valid_iso9660 = layer.iso
# The Rock Ridge extension announces itself and carries the real name, which
# plain ISO 9660 would have mangled to upper case.
file_contains = layer.iso, "IEEE_P1282"
file_contains = layer.iso, "MixedCase.txt"
file_contains = layer.iso, "MIXEDCASE.TXT"
file_sha256 = layer.iso, "188acd42e90eb09309d2dda949e4dd6b0259e3c16ab625e89e774eeb966632bb"
