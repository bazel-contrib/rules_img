[test]
name = fat32_layer_long_names
description = Long, mixed-case and Unicode names are stored as long file names with unique short names

[testdata]
copy = fat32_blob=ubuntu/blobs/sha256/1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02

[command]
subcommand = layer
args = --layer-format fat32 --add /README.TXT=fat32_blob --add /Readme.md=fat32_blob --add /a_rather_long_file_name.txt=fat32_blob --add /a_rather_long_file_name2.txt=fat32_blob --add /ünïcode-名前.txt=fat32_blob --add /.gitignore=fat32_blob layer.fat32
expect_exit = 0

[assert]
file_valid_fat32 = layer.fat32
file_contains = layer.fat32, "A_RATH~1TXT"
file_contains = layer.fat32, "A_RATH~2TXT"
file_contains = layer.fat32, "README  TXT"
file_sha256 = layer.fat32, "0b5dc19b9d12864fc2af70466de21c077f7428f5133868d77297bfa94b56e661"
