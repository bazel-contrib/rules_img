[test]
name = fat32_layer_sector_size
description = A FAT32 layer can have the sector size of a 4Kn disk, which makes the volume large

[file]
name = fat32_sector/hello.txt
Hello World

[command]
subcommand = layer
args = --layer-format fat32 --fat32-sector-size 4096 --add /hello.txt=fat32_sector/hello.txt fat32_sector.fat32
expect_exit = 0

[assert]
file_valid_fat32 = fat32_sector.fat32
file_contains = fat32_sector.fat32, "Hello World"
# 65541 clusters of 4096 bytes
file_size_gt = fat32_sector.fat32, 268000000
file_sha256 = fat32_sector.fat32, "1961e63e8686556de2d370c4d871fa377f5a4eb8a1fc0884e7ccbb0aba7c6e55"
