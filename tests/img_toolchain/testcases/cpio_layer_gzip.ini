[test]
name = cpio_layer_gzip
description = A cpio layer is compressed when asked to, and the metadata describes the compressed file

[file]
name = cpio_gzip/hello.txt
Hello World

[command]
subcommand = layer
args = --layer-format cpio --format gzip --add /init=cpio_gzip/hello.txt --metadata layer_meta.json layer.cpio.gz
expect_exit = 0

[assert]
file_valid_gzip = layer.cpio.gz
file_valid_json = layer_meta.json
json_field_equals = layer_meta.json, mediaType, application/x-cpio+gzip
