[test]
name = iso9660_layer_tree_artifact
description = Tree artifacts (directories) are stored in ISO 9660 layers

[file]
name = iso9660_tree/file1.txt
content for file 1

[file]
name = iso9660_tree/subdir/file2.txt
content for file 2

[command]
subcommand = layer
args = --layer-format iso9660 --add /data=iso9660_tree layer.iso
expect_exit = 0

[assert]
file_valid_iso9660 = layer.iso
file_contains = layer.iso, "content for file 1"
file_contains = layer.iso, "content for file 2"
file_sha256 = layer.iso, "6814ad6eca05aea3885da5d0e88f473adbe02483945b7e6fb63f053c6a5ece54"
