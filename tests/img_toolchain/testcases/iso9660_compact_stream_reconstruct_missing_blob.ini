[test]
name = iso9660_compact_stream_reconstruct_missing_blob
description = Reconstructing the compact stream of an ISO 9660 layer fails if the referenced blob is not available

[testdata]
copy = iso9660_cs_fixture.cstream=img_toolchain/iso9660_compact_stream/layer.cstream

[command]
subcommand = compact-stream
args = reconstruct --compact-stream iso9660_cs_fixture.cstream --cas-dir iso9660_empty_cas --output iso9660_reconstructed.iso
expect_exit = 1

[assert]
stderr_contains = "1e622c5f073b4f6bfad6632f2616c7f59ef256e96fe78bf6a595d1dc4376ac02"
