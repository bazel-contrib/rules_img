[test]
name = fat32_layer_ignores_tar_options
description = Options that only apply to tar layers are accepted and ignored for FAT32 layers

[file]
name = fat32_ignore/hello.txt
Hello World

[command]
subcommand = layer
args = --layer-format fat32 --estargz --compressor-jobs 4 --compression-level 9 --compact-stream-only --ztoc fat32_ignore.ztoc --create-parent-directories --layer-tree-artifact-handling deduplicate_symlink --add /a/b/hello.txt=fat32_ignore/hello.txt layer.fat32
expect_exit = 0

[assert]
file_exists = layer.fat32
file_valid_fat32 = layer.fat32
file_contains = layer.fat32, "Hello World"
file_not_exists = fat32_ignore.ztoc
file_sha256 = layer.fat32, "783f0cad1f024543e7292bbd71ee2e503e59e7f020a318d47ae498fe4188a9ce"
