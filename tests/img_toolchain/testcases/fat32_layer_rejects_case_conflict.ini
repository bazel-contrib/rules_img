[test]
name = fat32_layer_rejects_case_conflict
description = FAT is case insensitive, so names that differ only in case are rejected

[file]
name = fat32_case/hello.txt
Hello World

[command]
subcommand = layer
args = --format fat32 --add /Hello.txt=fat32_case/hello.txt --add /hello.TXT=fat32_case/hello.txt layer.fat32
expect_exit = 1

[assert]
stderr_contains = "differ only in case"
