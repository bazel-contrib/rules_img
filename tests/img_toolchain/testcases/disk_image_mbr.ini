[test]
name = disk_image_mbr
description = An MBR disk image with an active EFI system partition and a Linux partition

[command]
subcommand = disk-image
args = --partition-table mbr --output disk_mbr.img --partition boot --partition-type esp --partition-size 4MiB --partition-active --partition data --partition-type linux --partition-size 3MiB
expect_exit = 0

[assert]
file_valid_mbr = disk_mbr.img
file_size_gt = disk_mbr.img, 8388607
file_size_lt = disk_mbr.img, 8388609
file_sha256 = disk_mbr.img, "df0552d4cacb0cffe7a558b07a214b73e25c7096d82d1362b78fbc1ab5931caf"
