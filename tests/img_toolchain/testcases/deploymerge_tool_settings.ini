[test]
name = deploymerge_tool_settings
description = deploy-merge records the img tool settings resolved by Bazel in the merged manifest

[file]
name = input.json
{"operations":[{"command":"push","registry":"registry.example.com","repository":"team/app","tags":["latest"]}],"settings":{"push_strategy":"lazy","load_strategy":"lazy"}}

[command]
subcommand = deploy-merge
args = --push-strategy lazy --load-strategy lazy --tool-remote-cache grpcs://cache.example.com --tool-remote-instance-name main --tool-credential-helper-remote-cache /helpers/cache --tool-insecure input.json output.json
expect_exit = 0

[assert]
file_exists = output.json
file_valid_json = output.json
json_field_exists = output.json, settings
# the tool settings a deploy launcher falls back to when it runs outside `bazel run`
file_contains = output.json, "remote_cache":"grpcs://cache.example.com"
file_contains = output.json, "remote_instance_name":"main"
file_contains = output.json, "credential_helper_remote_cache":"/helpers/cache"
file_contains = output.json, "insecure":true
# settings nothing was recorded for stay out of the manifest
file_not_contains = output.json, "credential_helper_oci_registry"
file_not_contains = output.json, "registry_auth_file"
