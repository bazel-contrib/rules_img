[test]
name = ext4_layer_simple
description = Test ext4 layer creation with a file, a symlink and metadata output

[file]
name = ext4_simple/hello.txt
Hello World

[symlinks]
create = ext4_simple_link=ext4_simple/hello.txt

[command]
subcommand = layer
args = --format ext4 --add /etc/hello.txt=ext4_simple/hello.txt --add /etc/link=ext4_simple_link --metadata layer_meta.json layer.ext4
expect_exit = 0

[assert]
file_exists = layer.ext4
file_valid_ext4 = layer.ext4
file_contains = layer.ext4, "Hello World"
file_valid_json = layer_meta.json
json_field_equals = layer_meta.json, mediaType, application/x-ext4
file_contains = layer_meta.json, "sha256:"
file_not_contains = layer_meta.json, "tar"
file_sha256 = layer.ext4, "461807672f13a6164cc654074763099c8236d55177945844ad99db72f6060937"
file_sha256 = layer_meta.json, "cf68afdfae7974373ff938866c300c53fe1be0faa6035baa5f6764bf64fabc53"
