# Module roots published by the main release (tag v<version>): rules_img and its
# co-versioned img_tool. The signer plugins and rules_img_sbom are versioned
# independently and published from their own `<module>-v*` tags (for example
# `rules_img_signer_cosign-v0.0.1`, `rules_img_sbom-v0.0.1`) via the module_roots
# override in .github/workflows/release_module.yaml, so they are intentionally not
# part of this default set.
moduleRoots:
  - "."
  - "img_tool"
